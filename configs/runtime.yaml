runtime:
  site_id: "S001"
  camera_id: "cam01"
  timezone: "UTC"
  fps_limit: 10
  max_events: null
  dry_run: true
  output_jsonl: null

source:
  # file | rtsp | webcam
  type: "file"
  rtsp_url: null
  file_path: "data/samples/sample.avi"
  webcam_index: 0
  loop: false

model:
  # mock | yolo | onnx
  type: "mock"
  score_threshold: 0.25
  yolo_model_path: null
  onnx_model_path: null
  # Use "cuda:0" or "0" on an NVIDIA CUDA machine. Keep null/empty for auto CPU fallback.
  device: null

sensors:
  - name: "ultra_front"
    type: "constant"
    id: "ultra_front_01"
    sensor_type: "ultrasonic"
    unit: "m"
    interval_sec: 0.2
    constant_value: 1.5
  - name: "ultra_rear"
    type: "constant"
    id: "ultra_rear_01"
    sensor_type: "ultrasonic"
    unit: "m"
    interval_sec: 0.4
    constant_value: 2.2

rules:
  # Demo rule: screen center is (0, 0). Quadrants: 1=top-right, 2=top-left, 3=bottom-left, 4=bottom-right.
  danger_zones:
    - zone_id: "danger_q2"
      type: "quadrant"
      quadrant: 2
      severity: "MEDIUM"
  sensor_thresholds:
    - sensor: "ultra_front"
      less_than: 1.8
      severity: "HIGH"
      event_type: "PROXIMITY_RISK"

backend:
  url: "http://127.0.0.1:8080/api/ai/events"
  timeout_sec: 10.0

spool:
  file_path: "outputs/spool/pending_events.jsonl"
  flush_batch: 100
