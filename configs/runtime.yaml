runtime:
  site_id: "S001"
  camera_id: "cam01"
  timezone: "UTC"
  fps_limit: 10
  max_events: null
  dry_run: true
  output_jsonl: null

source:
  # file | rtsp | webcam
  type: "file"
  rtsp_url: null
  file_path: "data/samples/sample.avi"
  webcam_index: 0
  loop: false

model:
  # mock | yolo | onnx
  type: "mock"
  score_threshold: 0.25
  yolo_model_path: null
  onnx_model_path: null
  # Use "cuda:0" or "0" on an NVIDIA CUDA machine. Keep null/empty for auto CPU fallback.
  device: null
  # Used when model.type is yolo. ByteTrack keeps stable person IDs across frames.
  tracking: false
  tracker: "bytetrack.yaml"

sensors:
  - name: "ultra_front"
    type: "constant"
    id: "ultra_front_01"
    sensor_type: "ultrasonic"
    unit: "m"
    zone_ids: ["deck_floor_zone"]
    interval_sec: 0.2
    constant_value: 1.5
  - name: "ultra_rear"
    type: "constant"
    id: "ultra_rear_01"
    sensor_type: "ultrasonic"
    unit: "m"
    zone_ids: []
    interval_sec: 0.4
    constant_value: 2.2

rules:
  # Demo floor zone. Points are normalized to the full video frame and describe
  # a floor-plane polygon, not a screen quadrant.
  danger_zones:
    - zone_id: "deck_floor_zone"
      name: "floor zone"
      type: "polygon"
      severity: "MEDIUM"
      basis: "bbox_bottom_band"
      min_overlap_ratio: 0.2
      foot_band_ratio: 0.18
      points_norm:
        - {x: 0.560, y: 0.330}
        - {x: 0.985, y: 0.315}
        - {x: 0.985, y: 0.485}
        - {x: 0.540, y: 0.500}
  sensor_thresholds:
    - sensor: "ultra_front"
      less_than: 1.8
      severity: "HIGH"
      event_type: "PROXIMITY_RISK"
  ppe:
    enabled: true
    required: ["helmet", "vest"]
    min_person_confidence: 0.45
    min_ppe_confidence: 0.35
    severity: "HIGH"
    # Keep false for demos: absence alone can be caused by occlusion or camera angle.
    infer_missing_when_absent: false

backend:
  url: "http://127.0.0.1:8080/api/ai/events"
  timeout_sec: 10.0

spool:
  file_path: "outputs/spool/pending_events.jsonl"
  flush_batch: 100
